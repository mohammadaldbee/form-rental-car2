<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            margin-top: 5vh;
            min-height: 100vh;
            background-image: url("orange-background.jpg");
            background-size: cover;
            background-position: center;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center">
        <div class="card p-3 h-75 w-50 ">
            <h1 class="mb-5 mt-2">
                Search for a rental car
            </h1>
            <div class="mb-3">
                <label class="form-label fw-bold">Pick up Location</label>
                <input class="form-control form-control-lg" type="text"
                    placeholder="City, airport, region, district...">
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                <label class="form-check-label" for="checkDefault">
                    Deliver the car somewhere else
                </label>
            </div>
            <div class="row mt-3">
                <div class="col-lg-6 col-sm-12">
                    <label class="form-label fw-bold">
                        Date of pickup
                    </label>
                    <input type="date" class="form-control form-control-lg">
                    <div class="row mt-2">
                        <div class="col-lg-6 col-sm-12">
                            <select class="form-select form-select-lg">
                                <option>10</option>
                            </select>
                        </div>
                        <div class="col-lg-6 col-sm-12">
                            <select class="form-select form-select-lg">
                                <option>00</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 col-sm-12 ">
                    <label class="form-label fw-bold">
                        Date of delivery
                    </label>
                    <input type="date" class="form-control form-control-lg">
                    <div class="row mt-2">
                        <div class="col-lg-6 col-sm-12">
                            <select class="form-select form-select-lg">
                                <option>10</option>
                            </select>
                        </div>
                        <div class="col-lg-6 col-sm-12">
                            <select class="form-select form-select-lg">
                                <option>00</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="ml-1 mt-4 mb-3">
                    <div class="form-check  mb-3">
                        <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                        <label class="form-check-label fw-bold" for="checkDefault">
                            The driver's age between 30 and 65?
                        </label>
                    </div>
                    <div class="mb-3">
                        <p>✓ No credit card fees</p>
                        <p>✓ No change fees</p>
                        <p>✓ Price match guarantee</p>
                    </div>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-danger " type="button">Search</button>

                </div>

            </div>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>
</body>

</html>
